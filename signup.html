    <section id="signup" class="page" style="display: block;"> 
        <div class="form-container" style="height: 600px;">
            <h2 style="padding: 10px; text-align: center;">Create Account</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required >
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <div class="input-group">
                    <label for="pancard">Pancard</label>
                    <input type="text" id="Pancard" placeholder="Enter your Pan number" required>
                </div>
                <div class="input-group">
                    <a href="http://127.0.0.1:5501/ni/terms_and_conditions.html" target="_blank" style="text-decoration: none; color: white; font-size: large; padding:5px;">terms & conditions</a>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 45px; background: var(--primary); color: white; padding: 15px 30px; width: 100%; margin-top: 5px; ">Create Account</button>
            </form>
        </div>
    </section> 

</body>
